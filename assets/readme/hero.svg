<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Gather: one planner for your work and your life</title>
  <desc id="desc">The Gather wordmark beside three real links between its modules: a task is scheduled on the calendar, tracked hours become an invoice, and text extracted from a PDF becomes a note.</desc>

  <rect width="1200" height="400" rx="24" fill="#0b0b0c"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="176" font-size="124" font-weight="800" letter-spacing="-5" fill="#ffffff">gather.</text>
    <text x="68" y="250" font-size="32" fill="#ffffff">One planner for your work</text>
    <text x="68" y="292" font-size="32" fill="#ffffff">and your life.</text>
    <text x="68" y="352" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#a1a1aa">Windows / macOS / Linux</text>
  </g>

  <g id="module-links" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="600" text-anchor="middle">
    <g id="task-calendar" transform="translate(610 54)">
      <rect width="170" height="72" rx="14" fill="#1c1c1f" stroke="#3f3f46"/>
      <text x="85" y="45" fill="#ffffff">Task</text>
      <path d="M170 36H360" stroke="#a1a1aa" stroke-width="2"/><circle cx="170" cy="36" r="6" fill="#ffffff"/><circle cx="360" cy="36" r="6" fill="#ffffff"/>
      <text x="265" y="24" font-size="19" font-weight="400" fill="#a1a1aa">schedule</text>
      <rect x="360" width="170" height="72" rx="14" fill="#ffffff"/>
      <text x="445" y="45" fill="#0b0b0c">Calendar</text>
    </g>
    <g id="hours-invoice" transform="translate(610 164)">
      <rect width="170" height="72" rx="14" fill="#1c1c1f" stroke="#3f3f46"/>
      <text x="85" y="45" fill="#ffffff">Hours</text>
      <path d="M170 36H360" stroke="#a1a1aa" stroke-width="2"/><circle cx="170" cy="36" r="6" fill="#ffffff"/><circle cx="360" cy="36" r="6" fill="#ffffff"/>
      <text x="265" y="24" font-size="19" font-weight="400" fill="#a1a1aa">bill</text>
      <rect x="360" width="170" height="72" rx="14" fill="#ffffff"/>
      <text x="445" y="45" fill="#0b0b0c">Invoice</text>
    </g>
    <g id="pdf-note" transform="translate(610 274)">
      <rect width="170" height="72" rx="14" fill="#1c1c1f" stroke="#3f3f46"/>
      <text x="85" y="45" fill="#ffffff">PDF</text>
      <path d="M170 36H360" stroke="#a1a1aa" stroke-width="2"/><circle cx="170" cy="36" r="6" fill="#ffffff"/><circle cx="360" cy="36" r="6" fill="#ffffff"/>
      <text x="265" y="24" font-size="19" font-weight="400" fill="#a1a1aa">extract</text>
      <rect x="360" width="170" height="72" rx="14" fill="#ffffff"/>
      <text x="445" y="45" fill="#0b0b0c">Note</text>
    </g>
  </g>
</svg>
